<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <form id="myForm">

        <label>Name:</label>
        <input type="text" name="name" id="name" required>
        <br>

        <label>Password:</label>
        <input type="password" name="pass" id="pass" required>
        <br>

        <label>G-Mail:</label>
        <input type="email" name="gmail" id="gmail" required>
        <br>

        <label>Mobile Number:</label>
        <input type="tel" name="mob" id="mob" required>
        <br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" id="male" value="Male"> Male <br>
        <input type="radio" name="gender" id="female" value="Female"> Female <br>
        <input type="radio" name="gender" id="other" value="Other"> Other <br>

        <label>Course:</label><br>
        <input type="radio" name="course" id="btech" value="BTech"> BTech <br>
        <input type="radio" name="course" id="mtech" value="MTech"> MTech <br>
        <input type="radio" name="course" id="mca" value="MCA"> MCA <br>
        <input type="radio" name="course" id="mba" value="MBA"> MBA <br>
        <input type="radio" name="course" id="bca" value="BCA"> BCA <br>

        <br>
        <input type="submit" value="Confirm">

    </form>

    <script src="formscript.js"></script>

</body>
</html>
